---
name: Ansible Lint

# Reusable workflow — runs the full Ansible lint suite (yamllint, ansible-lint,
# markdownlint, checkov) for any Ansible collection or implementation repo.
#
# Tool config files (.yamllint.yml, .ansible-lint, markdownlint configs,
# .github/requirements.txt) must live in the calling repo. This workflow only
# orchestrates the tools; it does not own any config.
#
# Third-party actions (ansible-lint, markdownlint-cli2-action, checkov-action) are
# called directly as job steps here, NOT wrapped in one of this repo's own composite
# actions. GitHub Actions has a long-standing runner bug where an action's own
# GITHUB_ACTION_REF resolves to the ref of the *outer* composite action instead of
# its own pinned ref when composite actions are nested (actions/runner#2473,
# actions/runner#2525) — ansible-lint's action.yml relies on that value to fetch its
# version-matched requirements lockfile, so nesting it inside a composite action
# breaks it. Only wrap third-party actions in a composite action if they don't
# self-inspect their own ref.
#
# Minimal caller shape:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
#   jobs:
#     lint:
#       uses: PMuellerCH/shared-actions/.github/workflows/ansible_lint.yml@v1
#
# All inputs have sensible defaults — most callers need no 'with:' block at all.
# Implementation (playbook) repos with mixed content should set
# checkov-framework: 'all' rather than the 'ansible'-only default.

"on":
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use (for yamllint's environment only)"
        type: string
        default: "3.13"
      requirements-file:
        description: "Path to pip requirements file (must include yamllint)"
        type: string
        default: ".github/requirements.txt"
      install-self-collection:
        description: "Run 'ansible-galaxy collection install . --force' before linting, so ansible-lint can resolve modules from this repo's own galaxy.yml 'dependencies:'. 'true' for collection repos with non-ansible.builtin module dependencies, 'false' otherwise."
        type: string
        default: "false"
      ansible-requirements-file:
        description: "Path to a Galaxy requirements.yml for ansible-lint to resolve collection module references. Leave unset if the repo has none."
        type: string
        default: ""
      markdownlint-standard-config:
        description: "Path to the markdownlint config for regular markdown files"
        type: string
        default: ".markdownlint.yml"
      markdownlint-changelog-config:
        description: "Path to the markdownlint config for CHANGELOG.md. Leave unset to skip the second pass."
        type: string
        default: ""
      checkov-framework:
        description: "Checkov framework to scan. Override to 'all' for implementation repos."
        type: string
        default: "ansible"
      checkov-directory:
        description: "Directory to pass to checkov --directory"
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: PMuellerCH/shared-actions/.github/actions/ansible-setup@v1
        with:
          python-version: ${{ inputs.python-version }}
          requirements-file: ${{ inputs.requirements-file }}

      - name: Install self (collection only)
        if: ${{ inputs.install-self-collection == 'true' }}
        shell: bash
        run: ansible-galaxy collection install . --force

      - name: Run yamllint
        shell: bash
        run: yamllint --config-file .yamllint.yml .

      - name: Run ansible-lint
        uses: ansible/ansible-lint@v26.8.0
        with:
          requirements_file: ${{ inputs.ansible-requirements-file }}

      # markdownlint-cli2 does not read .gitignore automatically (unlike some other
      # linters), so gitignored artifact dirs must be excluded explicitly here.
      # .ansible/ is where `ansible-galaxy collection install .` (install-self-collection)
      # places the installed collection copy, including its own CHANGELOG.md — without
      # this exclusion, that copy gets linted as if it were repo content.
      - name: Run markdownlint (standard files)
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: ${{ inputs.markdownlint-standard-config }}
          globs: |
            **/*.md
            #CHANGELOG.md
            #**/node_modules/**
            #**/.ansible/**

      # Two-pass markdownlint: standard files use a strict line-length limit;
      # CHANGELOG.md uses a relaxed limit because release-please generates long lines.
      - name: Check for CHANGELOG.md pass
        id: changelog-check
        shell: bash
        run: |
          if [ -n "${{ inputs.markdownlint-changelog-config }}" ] && [ -f "CHANGELOG.md" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run markdownlint (CHANGELOG.md)
        if: steps.changelog-check.outputs.run == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: ${{ inputs.markdownlint-changelog-config }}
          globs: CHANGELOG.md

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12.3119.0
        with:
          directory: ${{ inputs.checkov-directory }}
          framework: ${{ inputs.checkov-framework }}
          output_format: cli
          quiet: "true"
          soft_fail: "false"
