---
name: "Ansible Lint Suite"
description: "Run the full Ansible lint suite: yamllint, ansible-lint (official action), markdownlint (official action, two-pass), and checkov (official action). Assumes ansible-setup has already run for yamllint's Python environment."

inputs:
  install-self-collection:
    description: >-
      Run 'ansible-galaxy collection install . --force' before linting, so ansible-lint can
      resolve modules from collections declared in this repo's own galaxy.yml
      'dependencies:' (e.g. community.general). Only affects the ~/.ansible/collections
      install destination, not the working-tree copy of galaxy.yml, so it's safe to combine
      with yamllint in the same job. 'true' for collection repos that declare
      non-ansible.builtin module dependencies; 'false' (default) otherwise.
    required: false
    default: "false"
  ansible-requirements-file:
    description: "Path to a Galaxy requirements.yml for role/collection dependencies ansible-lint needs to resolve module references. Leave empty to skip (no collection dependencies to install)."
    required: false
    default: ""
  markdownlint-standard-config:
    description: "Path to the markdownlint config for regular markdown files"
    required: false
    default: ".markdownlint.yml"
  markdownlint-changelog-config:
    description: "Path to the markdownlint config for CHANGELOG.md. Leave empty to skip the second pass (repo has no CHANGELOG.md or uses one config for everything)."
    required: false
    default: ""
  checkov-framework:
    description: "Checkov framework to scan. Override to 'all' for implementation repos with mixed content."
    required: false
    default: "ansible"
  checkov-directory:
    description: "Directory to scan with checkov"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Install self (collection only)
      if: ${{ inputs.install-self-collection == 'true' }}
      shell: bash
      run: ansible-galaxy collection install . --force

    - name: Run yamllint
      shell: bash
      run: yamllint --config-file .yamllint.yml .

    # NOTE: composite action `uses:` refs cannot be templated with ${{ inputs.x }} —
    # GitHub Actions does not expose the 'inputs' context there (only 'github'/'env').
    # These versions must stay hardcoded literals; Renovate's github-actions manager
    # bumps them directly from the `uses:` line, same as anywhere else.
    - name: Run ansible-lint
      uses: ansible/ansible-lint@v26.8.0
      with:
        requirements_file: ${{ inputs.ansible-requirements-file }}

    - name: Run markdownlint (standard files)
      uses: DavidAnson/markdownlint-cli2-action@v24.2.0
      with:
        config: ${{ inputs.markdownlint-standard-config }}
        globs: |
          **/*.md
          #CHANGELOG.md
          #**/node_modules/**

    # Two-pass markdownlint: standard files use a strict line-length limit;
    # CHANGELOG.md uses a relaxed limit because release-please generates long lines.
    - name: Check for CHANGELOG.md pass
      id: changelog-check
      shell: bash
      run: |
        if [ -n "${{ inputs.markdownlint-changelog-config }}" ] && [ -f "CHANGELOG.md" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Run markdownlint (CHANGELOG.md)
      if: steps.changelog-check.outputs.run == 'true'
      uses: DavidAnson/markdownlint-cli2-action@v24.2.0
      with:
        config: ${{ inputs.markdownlint-changelog-config }}
        globs: CHANGELOG.md

    - name: Run checkov
      uses: bridgecrewio/checkov-action@v12.3117.0
      with:
        directory: ${{ inputs.checkov-directory }}
        framework: ${{ inputs.checkov-framework }}
        output_format: cli
        quiet: "true"
        soft_fail: "false"
